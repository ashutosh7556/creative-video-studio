[project]
name = "cvs-tts"
version = "0.1.0"
description = "Kokoro TTS sidecar for Creative Video Studio"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "kokoro-onnx>=0.6.1",
  "soundfile>=0.13",
  "numpy>=1.26",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
